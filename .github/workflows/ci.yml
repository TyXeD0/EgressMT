name: CI

on:
  push:
  pull_request:
  schedule:
    # Upstream MTProxyL can change without an EgressMT commit. A daily build
    # gives us an early warning when the panel patch stops applying/building.
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile src/*.py panel/*.py
      - name: Shell syntax
        run: bash -n install.sh lib/*.sh src/*.sh panel/*.sh scripts/*.sh
      - name: Go syntax
        run: gofmt panel/backend/egress.go >/dev/null
      - name: Repository safety
        run: bash scripts/repo-safety-check.sh

  panel-build-current-upstream:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current MTProxyL source
        run: git clone --filter=blob:none --depth=1 https://github.com/Liafanx/MTProxyL.git /tmp/MTProxyL
      - name: Show upstream versions
        run: |
          echo "MTProxyL $(cat /tmp/MTProxyL/version)"
          sed -nE 's/^[[:space:]]*var version = "([^"]+)".*/Panel \1/p' /tmp/MTProxyL/mtproxyl-panel/main.go
          git -C /tmp/MTProxyL rev-parse HEAD
      - name: Apply EgressMT panel patch twice (idempotency)
        run: |
          python3 panel/patch.py /tmp/MTProxyL/mtproxyl-panel panel
          python3 panel/patch.py /tmp/MTProxyL/mtproxyl-panel panel
      - name: Build patched current panel
        run: |
          UPSTREAM_VERSION="$(sed -nE 's/^[[:space:]]*var version = "([^"]+)".*/\1/p' /tmp/MTProxyL/mtproxyl-panel/main.go | head -n1)"
          test -n "$UPSTREAM_VERSION"
          docker build \
            --build-arg TARGETARCH=amd64 \
            --build-arg VERSION="${UPSTREAM_VERSION}-egressmt-ci" \
            -t egressmt-panel-ci \
            /tmp/MTProxyL/mtproxyl-panel
