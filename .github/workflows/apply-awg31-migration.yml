name: Apply AWG 3.1 migration and multi-DC health

on:
  push:
    paths:
      - '.github/workflows/apply-awg31-migration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration patch
        run: |
          python3 scripts/apply-awg31-migration.py
          python3 -m py_compile src/*.py panel/*.py
          bash -n bootstrap.sh install.sh lib/*.sh src/*.sh panel/*.sh scripts/*.sh
          gofmt -w panel/backend/egress.go
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-awg31-migration.yml scripts/apply-awg31-migration.py
          git add README.md lib/install-core.sh src/egressd.py src/provision.py src/provision-wrapper.py src/cli.py panel/job-runner.py panel/backend/egress.go panel/frontend/api.fragment.ts panel/frontend/EgressPage.tsx
          git commit -m 'Add AWG 3.1 transport migration and multi-DC health'
          git push
