name: Fix Core startup readiness race

on:
  push:
    paths:
      - '.github/workflows/fix-core-startup-race.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch install-core readiness checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/install-core.sh')
          s = p.read_text()
          old_pre = '''/usr/local/libexec/mtproxyl-egress-registry validate
/usr/local/libexec/mtproxyl-egress-provision preflight | python3 -m json.tool >/dev/null
'''
          new_pre = '''/usr/local/libexec/mtproxyl-egress-registry validate
msg "Проверяю provisioner..." "Checking provisioner..."
PREFLIGHT_JSON="$(/usr/local/libexec/mtproxyl-egress-provision preflight)" \\
    || fail "EgressMT provisioner preflight failed"
printf '%s\\n' "$PREFLIGHT_JSON" | python3 -m json.tool >/dev/null \\
    || fail "EgressMT provisioner returned invalid preflight JSON"
'''
          old_tail = '''for _ in $(seq 1 20); do
    systemctl is-active --quiet mtproxyl-egressd.service && break
    sleep 1
done
systemctl is-active --quiet mtproxyl-egressd.service || fail "EgressMT daemon failed to start"
/usr/local/bin/egressmt status --json | python3 -m json.tool >/dev/null
'''
          new_tail = '''msg "Ожидаю готовности EgressMT daemon..." "Waiting for EgressMT daemon readiness..."
READY=0
STATUS_JSON=""
for _ in $(seq 1 30); do
    if systemctl is-active --quiet mtproxyl-egressd.service \\
        && [[ -S /run/mtproxyl-egress/control.sock ]]; then
        STATUS_JSON="$(/usr/local/bin/egressmt status --json 2>/dev/null || true)"
        if [[ -n "$STATUS_JSON" ]] && printf '%s\\n' "$STATUS_JSON" | python3 -m json.tool >/dev/null 2>&1; then
            READY=1
            break
        fi
    fi
    sleep 1
done
if (( READY != 1 )); then
    echo "--- mtproxyl-egressd status ---" >&2
    systemctl --no-pager --full status mtproxyl-egressd.service >&2 || true
    echo "--- mtproxyl-egressd journal ---" >&2
    journalctl -u mtproxyl-egressd.service -n 80 --no-pager >&2 || true
    fail "EgressMT daemon did not become ready (control socket/status unavailable)"
fi
'''
          if old_pre not in s:
              raise SystemExit('preflight anchor not found')
          if old_tail not in s:
              raise SystemExit('startup anchor not found')
          s = s.replace(old_pre, new_pre, 1).replace(old_tail, new_tail, 1)
          p.write_text(s)
          PY
          bash -n lib/install-core.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/install-core.sh
          git commit -m 'Wait for daemon control socket before status check'
          git push
