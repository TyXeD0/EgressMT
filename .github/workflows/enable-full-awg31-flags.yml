name: Enable full AWG 3.1 flags

on:
  push:
    paths:
      - '.github/workflows/enable-full-awg31-flags.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Enable RandomTrailers and DisableCookies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/provision-wrapper.py')
          s = p.read_text()

          old = '''        "keepalive-timeout", "8-12",\n        "max-handshake-attempts", "16-24",\n    ]'''
          new = '''        "keepalive-timeout", "8-12",\n        "max-handshake-attempts", "16-24",\n        "random-trailers", "on",\n        "disable-cookies", "on",\n    ]'''
          if old not in s:
              raise SystemExit('local probe anchor not found')
          s = s.replace(old, new, 1)

          old = '''    keepalive-timeout 8-12\n    max-handshake-attempts 16-24)'''
          new = '''    keepalive-timeout 8-12\n    max-handshake-attempts 16-24\n    random-trailers on\n    disable-cookies on)'''
          if old not in s:
              raise SystemExit('remote probe anchor not found')
          s = s.replace(old, new, 1)

          old = '''        "MaxHandshakeAttempts": f"{r.randint(16, 19)}-{r.randint(21, 26)}",\n        "PersistentKeepalive": f"{r.randint(20, 23)}-{r.randint(27, 32)}",'''
          new = '''        "MaxHandshakeAttempts": f"{r.randint(16, 19)}-{r.randint(21, 26)}",\n        "RandomTrailers": True,\n        "DisableCookies": True,\n        "PersistentKeepalive": f"{r.randint(20, 23)}-{r.randint(27, 32)}",'''
          if old not in s:
              raise SystemExit('params anchor not found')
          s = s.replace(old, new, 1)

          old = '''    if params.get("HeaderProtectionKey"):\n        lines.append(f"HeaderProtectionKey = {params['HeaderProtectionKey']}")'''
          new = '''    lines.append("RandomTrailers = on")\n    # DisableCookies removes the cookie-reply path, reducing another recognizable\n    # handshake behavior. This is intentionally enabled for private point-to-point\n    # EgressMT links; operators should note the corresponding loss of cookie-based\n    # DoS mitigation on the AWG interface.\n    lines.append("DisableCookies = on")\n    if params.get("HeaderProtectionKey"):\n        lines.append(f"HeaderProtectionKey = {params['HeaderProtectionKey']}")'''
          if old not in s:
              raise SystemExit('config render anchor not found')
          s = s.replace(old, new, 1)

          old = '''            "awg31": True,\n            "header_protection_supported": hpk,'''
          new = '''            "awg31": True,\n            "random_trailers": True,\n            "disable_cookies": True,\n            "header_protection_supported": hpk,'''
          if old not in s:
              raise SystemExit('preflight transport anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          python3 -m py_compile src/provision-wrapper.py
          git diff --check
          grep -q 'random-trailers", "on"' src/provision-wrapper.py
          grep -q 'disable-cookies", "on"' src/provision-wrapper.py
          grep -q 'RandomTrailers = on' src/provision-wrapper.py
          grep -q 'DisableCookies = on' src/provision-wrapper.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/provision-wrapper.py
          git commit -m 'Require full AWG 3.1 transport flags'
          git push
