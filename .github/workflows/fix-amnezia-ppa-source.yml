name: Fix Amnezia PPA source normalization

on:
  push:
    paths:
      - '.github/workflows/fix-amnezia-ppa-source.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch installer and remote provisioner
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'{path}: anchor not found')
              p.write_text(s.replace(old,new,1))

          # ENTRY: normalize stale/duplicate PPA definitions before the very first apt update.
          rep('lib/install-core.sh',
          '''msg "Проверка зависимостей..." "Checking dependencies..."
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o DPkg::Lock::Timeout=120 update -y >/dev/null
          ''',
          '''normalize_amnezia_sources(){
              local needle="ppa.launchpadcontent.net/amnezia/ppa/ubuntu"
              local backup="/var/lib/egressmt/apt-source-backups/$(date +%Y%m%d-%H%M%S)"
              local changed=0 src
              for src in /etc/apt/sources.list.d/*; do
                  [[ -f "$src" ]] || continue
                  grep -Fqs "$needle" "$src" || continue
                  (( changed == 1 )) || { install -d -m 700 "$backup"; changed=1; }
                  cp -a "$src" "$backup/$(basename "$src")"
                  if [[ "$src" == *.sources ]]; then
                      python3 - "$src" "$needle" <<'PY2'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); needle=sys.argv[2]
          text=p.read_text(encoding='utf-8',errors='replace')
          stanzas=[x for x in re.split(r'\n[ \t]*\n',text.strip()) if x.strip()]
          keep=[x for x in stanzas if needle not in x]
          if keep:
              p.write_text('\n\n'.join(keep)+'\n',encoding='utf-8')
          else:
              p.unlink()
          PY2
                  else
                      sed -i "\\|$needle|d" "$src"
                      [[ -s "$src" ]] || rm -f "$src"
                  fi
              done
              if [[ -f /etc/apt/sources.list ]] && grep -Fqs "$needle" /etc/apt/sources.list; then
                  (( changed == 1 )) || { install -d -m 700 "$backup"; changed=1; }
                  cp -a /etc/apt/sources.list "$backup/sources.list"
                  sed -i "\\|$needle|d" /etc/apt/sources.list
              fi
          }

          msg "Проверка зависимостей..." "Checking dependencies..."
          export DEBIAN_FRONTEND=noninteractive
          normalize_amnezia_sources
          apt-get -o DPkg::Lock::Timeout=120 update -y >/dev/null
          ''')

          rep('lib/install-core.sh',
          '''    msg "Устанавливаю или обновляю AmneziaWG..." "Installing or updating AmneziaWG..."
              curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 10 \\
                  "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x${fpr}" \\
                  -o "$armored" || fail "cannot download Amnezia PPA signing key"

              got="$(gpg --batch --show-keys --with-colons "$armored" 2>/dev/null | awk -F: '$1=="fpr"{print $10; exit}')"
              [[ "$got" == "$fpr" ]] || fail "Amnezia PPA signing-key fingerprint mismatch"

              install -d -m 755 /usr/share/keyrings
              gpg --batch --yes --dearmor --output "$keyring" "$armored"
              chmod 644 "$keyring"
          ''',
          '''    msg "Устанавливаю или обновляю AmneziaWG..." "Installing or updating AmneziaWG..."
              normalize_amnezia_sources
              if [[ -f "$keyring" ]]; then
                  got="$(gpg --batch --show-keys --with-colons "$keyring" 2>/dev/null | awk -F: '$1=="fpr"{print $10; exit}')"
              fi
              if [[ "$got" != "$fpr" ]]; then
                  rm -f "$armored"
                  curl -fsSL --retry 7 --retry-delay 3 --retry-all-errors --connect-timeout 10 \\
                      "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x${fpr}" \\
                      -o "$armored" || fail "cannot download Amnezia PPA signing key"
                  got="$(gpg --batch --show-keys --with-colons "$armored" 2>/dev/null | awk -F: '$1=="fpr"{print $10; exit}')"
                  [[ "$got" == "$fpr" ]] || fail "Amnezia PPA signing-key fingerprint mismatch"
                  install -d -m 755 /usr/share/keyrings
                  gpg --batch --yes --dearmor --output "$keyring" "$armored"
              fi
              chmod 644 "$keyring"
          ''')

          # EXIT: same normalization before its first apt update, plus reuse a verified keyring.
          rep('src/provision-wrapper.py',
          '''APT=(apt-get -o DPkg::Lock::Timeout=120)
          "${APT[@]}" update -y >/dev/null
          ''',
          '''normalize_amnezia_sources() {
            local needle="ppa.launchpadcontent.net/amnezia/ppa/ubuntu" src
            for src in /etc/apt/sources.list.d/*; do
              [[ -f "$src" ]] || continue
              grep -Fqs "$needle" "$src" || continue
              if [[ "$src" == *.sources ]]; then
                python3 - "$src" "$needle" <<'PY2'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); needle=sys.argv[2]
          text=p.read_text(encoding='utf-8',errors='replace')
          stanzas=[x for x in re.split(r'\n[ \t]*\n',text.strip()) if x.strip()]
          keep=[x for x in stanzas if needle not in x]
          if keep: p.write_text('\n\n'.join(keep)+'\n',encoding='utf-8')
          else: p.unlink()
          PY2
              else
                sed -i "\\|$needle|d" "$src"
                [[ -s "$src" ]] || rm -f "$src"
              fi
            done
            if [[ -f /etc/apt/sources.list ]] && grep -Fqs "$needle" /etc/apt/sources.list; then
              sed -i "\\|$needle|d" /etc/apt/sources.list
            fi
          }

          APT=(apt-get -o DPkg::Lock::Timeout=120)
          normalize_amnezia_sources
          "${APT[@]}" update -y >/dev/null
          ''')

          rep('src/provision-wrapper.py',
          '''  curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 10 \\
              "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x${FPR}" \\
              -o "$KEY"

            GOT="$(gpg --batch --show-keys --with-colons "$KEY" 2>/dev/null | awk -F: '$1=="fpr"{print $10; exit}')"
            [[ "$GOT" == "$FPR" ]] || {
              echo "Amnezia PPA signing-key fingerprint mismatch" >&2
              exit 74
            }

            install -d -m 755 /usr/share/keyrings
            gpg --batch --yes --dearmor --output "$KEYRING" "$KEY"
            chmod 644 "$KEYRING"
          ''',
          '''  normalize_amnezia_sources
            GOT=""
            if [[ -f "$KEYRING" ]]; then
              GOT="$(gpg --batch --show-keys --with-colons "$KEYRING" 2>/dev/null | awk -F: '$1=="fpr"{print $10; exit}')"
            fi
            if [[ "$GOT" != "$FPR" ]]; then
              curl -fsSL --retry 7 --retry-delay 3 --retry-all-errors --connect-timeout 10 \\
                "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x${FPR}" \\
                -o "$KEY"
              GOT="$(gpg --batch --show-keys --with-colons "$KEY" 2>/dev/null | awk -F: '$1=="fpr"{print $10; exit}')"
              [[ "$GOT" == "$FPR" ]] || {
                echo "Amnezia PPA signing-key fingerprint mismatch" >&2
                exit 74
              }
              install -d -m 755 /usr/share/keyrings
              gpg --batch --yes --dearmor --output "$KEYRING" "$KEY"
            fi
            chmod 644 "$KEYRING"
          ''')
          PY
          python3 -m py_compile src/provision-wrapper.py
          bash -n lib/install-core.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/install-core.sh src/provision-wrapper.py
          git commit -m 'Repair conflicting Amnezia PPA sources' || exit 0
          git push
